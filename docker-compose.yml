services:
  hatrecruitment_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ""
    container_name: hatrecruitment_app
    restart: unless-stopped
    environment:
      BASE_PATH: ""
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.0.14:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:32b}
      NODE_ENV: production
    networks:
      - staging_net
    # No ports exposed — nginx proxies from the staging network

networks:
  staging_net:
    external: true
    name: staging_staging_net
