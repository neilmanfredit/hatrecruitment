services:
  hat-recruit-db:
    image: postgres:16-alpine
    container_name: hat-recruit-db
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: hat_recruit
      POSTGRES_USER: hat_recruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hat_recruit_db:/var/lib/postgresql/data
    networks:
      - hat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hat_recruit"]
      interval: 10s
      timeout: 5s
      retries: 5

  hat-recruit-redis:
    image: redis:7-alpine
    container_name: hat-recruit-redis
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - hat_recruit_redis:/data
    networks:
      - hat_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hat-recruit-storage:
    image: localstack/localstack:3.8
    container_name: hat-recruit-storage
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SERVICES: s3
      PERSISTENCE: 1
      # LocalStack S3 accepts any credential values
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - hat_recruit_storage:/var/lib/localstack
    networks:
      - hat_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  hat-recruit-storage-init:
    image: amazon/aws-cli:latest
    container_name: hat-recruit-storage-init
    depends_on:
      hat-recruit-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: |
      /bin/sh -c "
        EP=http://hat-recruit-storage:4566
        aws --endpoint-url=$$EP s3 mb s3://hat-recruit-cvs       --region us-east-1 2>/dev/null || true
        aws --endpoint-url=$$EP s3 mb s3://hat-recruit-contracts  --region us-east-1 2>/dev/null || true
        aws --endpoint-url=$$EP s3 mb s3://hat-recruit-timesheets --region us-east-1 2>/dev/null || true
        aws --endpoint-url=$$EP s3 mb s3://hat-recruit-invoices   --region us-east-1 2>/dev/null || true
        echo 'S3 buckets initialised'
      "
    networks:
      - hat_net
    restart: on-failure

  hat-recruit-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ""
    container_name: hat-recruit-app
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      hat-recruit-db:
        condition: service_healthy
      hat-recruit-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hat_recruit:${POSTGRES_PASSWORD}@hat-recruit-db:5432/hat_recruit
      REDIS_URL: redis://:${REDIS_PASSWORD}@hat-recruit-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://hat-recruit-storage:4566
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.0.14:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:32b}
      OLLAMA_NUM_CTX: "8192"
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      REED_API_KEY: ${REED_API_KEY:-}
      PROXYCURL_API_KEY: ${PROXYCURL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "3011:3010"
    networks:
      - hat_net

  hat-recruit-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hat-recruit-worker
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      hat-recruit-db:
        condition: service_healthy
      hat-recruit-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hat_recruit:${POSTGRES_PASSWORD}@hat-recruit-db:5432/hat_recruit
      REDIS_URL: redis://:${REDIS_PASSWORD}@hat-recruit-redis:6379
      MINIO_ENDPOINT: http://hat-recruit-storage:4566
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.0.14:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:32b}
      OLLAMA_NUM_CTX: "8192"
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
    networks:
      - hat_net

networks:
  hat_net:
    driver: bridge
    name: hat_recruit_net

volumes:
  hat_recruit_db:
    name: hat_recruit_db
  hat_recruit_redis:
    name: hat_recruit_redis
  hat_recruit_storage:
    name: hat_recruit_storage
